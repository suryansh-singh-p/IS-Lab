services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-video_interview}
      POSTGRES_USER: ${POSTGRES_USER:-video_interview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-video_interview} -d ${POSTGRES_DB:-video_interview}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      UPLOADS_DIR: /app/uploads
      WHISPER_SCRIPT_PATH: /app/scripts/whisper_transcribe.py
      DEEPFACE_SCRIPT_PATH: /app/scripts/deepface_analyze.py
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-video_interview}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-video_interview}}
      DATABASE_USE_SSL: ${DATABASE_USE_SSL:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    command: sh -c "npm run migrate && npm run migrate:eval && npm start"
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
