services:
  backend:
    build:
      context: ./video-interview-platform/backend
      dockerfile: Dockerfile
    env_file:
      - ./video-interview-platform/backend/.env
    environment:
      NODE_ENV: production
      PORT: ${BACKEND_PORT:-5000}
      UPLOADS_DIR: /app/uploads
      WHISPERX_SCRIPT_PATH: /app/scripts/whisper_transcribe.py
      DEEPFACE_SCRIPT_PATH: /app/scripts/deepface_analyze.py
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - ./video-interview-platform/backend/uploads:/app/uploads
    depends_on:
      - ollama

  frontend:
    build:
      context: ./video-interview-platform/frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama:

