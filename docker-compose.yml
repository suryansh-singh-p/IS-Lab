version: '3.8'

services:
  backend:
    image: suryansh180704/islab:backend1.1
    env_file:
      - .env  # <- CHANGED: Updated to point to the .env file in your current folder
    environment:
      NODE_ENV: production
      # Keep container-internal port fixed; expose host port separately below.
      PORT: 5000
      UPLOADS_DIR: /app/uploads
      WHISPERX_SCRIPT_PATH: /app/scripts/whisper_transcribe.py
      DEEPFACE_SCRIPT_PATH: /app/scripts/deepface_analyze.py
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-llama3.2:3b}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      # Force TensorFlow (used by DeepFace) to CPU — no GPU in Docker
      CUDA_VISIBLE_DEVICES: ""
      TF_CPP_MIN_LOG_LEVEL: "3"
      TF_ENABLE_ONEDNN_OPTS: "0"
    ports:
      - "${BACKEND_PORT:-8020}:5000"
    volumes:
      - ./video-interview-platform/backend/uploads:/app/uploads
    depends_on:
      - ollama

  frontend:
    image: suryansh180704/islab:frontend1.1
    ports:
      - "${FRONTEND_PORT:-3020}:80"
      - "${FRONTEND_HTTPS_PORT:-3021}:443"
    depends_on:
      - backend

  ollama:
    image: suryansh180704/islab:llm1.0 # <- CHANGED: Uses the custom LLM image you pushed
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama: